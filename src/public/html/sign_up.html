<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Sign up</title>
</head>
<body>
<header>
    <nav class="navbar navbar-expand fixed-top vw-100">
        <div class="container">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="./login.html" class="nav-link">Login</a>
                </li>
                <li class="nav-item">
                    <a href="./index.html" class="nav-link">Inventory</a>
                </li>
            </ul>
        </div>
    </nav>
</header>
<main>
    <div class="container d-flex justify-content-center align-items-center vh-100" style="text-align: center;">
        <div class="row-cols-1">
            <div>
                <h1 class="h1 mb-3">Sign up</h1>
            </div>
            <div class="border border-primary rounded p-4" style="width: 400px;">
                <form id="form_sign_up"> 
                    <div class="mb-3">
                        <label for="id" class="form-label">ID</label>
                        <input type="text" class="form-control" id="id" name="id">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label for="position" class="form-label">Position</label>
                        <input type="text" class="form-control" id="position" name="position">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password">
                    </div>
                    <button class="btn btn-primary w-100 mb-3">Submit</button>
                    <a href="login.html" class="link link-primary">Alredy have a account?</a>
                </form>
            </div>
        </div>
    </div>
</main>
<script src="../javascript/sign_up.js"></script>
</body>
</html>
