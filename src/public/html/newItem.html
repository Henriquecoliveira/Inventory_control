<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>NewItem</title>
</head>
<body>
<header>
    <nav class="navbar navbar-expand fixed-top vw-100">
        <div class="container">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="./login.html" class="nav-link">Login</a>
                </li>
                <li class="nav-item">
                    <a href="./index.html" class="nav-link">Inventory</a>
                </li>
                <li class="nav-item">
                    <a href="./newItem.html" class="nav-link active" aria-current="page">Add itens</a>
                </li>
            </ul>
        </div>
    </nav>
</header>
<main>
    <div class="container">
        <div class="row">
            <div class="col d-flex justify-content-center align-items-center vh-100">
                <form class="border border-primary rounded p-4" style="text-align: center; width: 30dvw;" id="form_new_item">
                    <!--name, description? brand? quantity, unit?-->
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description">
                    </div>
                    <div class="mb-3">
                        <label for="brand" class="form-label">Brand</label>
                        <input type="text" class="form-control" id="brand" name="brand">
                    </div>
                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="text" class="form-control" id="quantity" name="quantity">
                    </div>
                    <div class="mb-3">
                        <label for="unit" class="form-label">Unit</label>
                        <input type="text" class="form-control" id="unit" name="unit">
                    </div>
                    <button class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>
</main>
<script src="../javascript/newItem.js"></script>
</body>
</html>
